name: Engineering Loop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Smoke check target URL
        required: true
        default: https://todari.dev
        type: string

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref || github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  smoke:
    name: Production smoke check
    if: >-
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production' &&
      github.event.deployment_status.creator.login == 'vercel[bot]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SMOKE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke
